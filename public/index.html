<!doctype html>
<html lang="zh-CN" data-layout="exact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kane Wang转正汇报</title>
<meta name="description" content="Kane Wang转正汇报：向下滚动，跟着影像看四个做事的动作。">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ───────── 设计变量 ─────────
   ink   影棚里的黑；paper 冷调纸白；rim 视频左侧那道洋红轮廓光，只用在“可点击”的提示上 */
:root{
  --ink:#07080b;
  --paper:#f3f5fb;
  --blue:#86a6e0;
  --rim:#e2387f;
  --graphite:#2a2d38;

  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --brush:"Ma Shan Zheng","Noto Serif SC","Songti SC",cursive;
  --brush-dry:"Zhi Mang Xing","Ma Shan Zheng","Noto Serif SC","Songti SC",cursive;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  /* 文案容器：fixed + 水平居中。垂直位置只改这一个值；想要正中间就写 50% */
  --caption-y:82%;
  --fade:.5s;          /* 三段视频、文案的统一淡入淡出时长 */
  --dur:8.25;          /* 主视频秒数，JS 读到 metadata 后会覆盖 */
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color-scheme:dark;scrollbar-width:none;-webkit-text-size-adjust:100%}
html::-webkit-scrollbar{display:none}
body{font-family:var(--sans);color:#fff;background:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.is-viewing,html.is-viewing body{overflow:hidden}
button{font:inherit;color:inherit}

/* ───────── 页面总高度 = 主视频时长 × 100vh ───────── */
#scroll-space{position:relative;z-index:0;height:calc(var(--dur) * 100vh);pointer-events:none}

/* ───────── 全屏视频背景（三段同时渲染，用 opacity 切换） ───────── */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink);
  transition:filter .7s ease,transform .7s ease}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  opacity:0;transition:opacity var(--fade) ease;pointer-events:none;background:var(--ink);
  -webkit-transform:translateZ(0);transform:translateZ(0)}
.layer.is-on{opacity:1}
#v-intro{transform:scale(1.07)}                       /* 留出鼠标视差的余量 */
html.is-viewing .stage{filter:blur(18px) brightness(.5) saturate(.85);transform:scale(1.06)}

/* 竖屏：视频里的泡泡会被裁掉，所以压暗背景，改用下面的 2×2 泡泡 */
.scrim{position:fixed;inset:0;z-index:1;background:rgba(7,8,11,.8);opacity:0;pointer-events:none;transition:opacity .6s ease}
html[data-layout="grid"].at-end .scrim{opacity:1}

/* ───────── 固定的小件：品牌、进度轨 ───────── */
.brand{position:fixed;z-index:6;left:clamp(20px,3vw,44px);top:calc(env(safe-area-inset-top,0px) + clamp(16px,3vh,30px));
  padding:.75em 1.1em .75em 1.3em;background:#050506;color:#fff;font:700 13px/1 var(--serif);letter-spacing:.2em;pointer-events:none;
  clip-path:polygon(0 8%,100% 0,98% 100%,1% 92%)}

.rail{position:fixed;z-index:6;right:clamp(12px,1.8vw,28px);top:50%;height:30vh;width:14px;transform:translateY(-50%);
  mix-blend-mode:difference;pointer-events:none}
.rail__line,.rail__fill{position:absolute;right:0;top:0;width:2px;height:100%}
.rail__line{background:rgba(255,255,255,.3)}
.rail__fill{background:#fff;transform-origin:top;transform:scaleY(var(--p,0))}
.rail__tick{position:absolute;right:0;width:10px;height:2px;background:#fff}
html.is-viewing .rail{opacity:0}

/* ───────── 首屏 ───────── */
.hero{position:fixed;z-index:5;left:clamp(20px,6vw,96px);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(56px,13vh,140px));
  max-width:88vw;color:#fff;mix-blend-mode:difference;
  transition:opacity var(--fade) ease,visibility 0s linear var(--fade);will-change:transform}
.hero.is-off{opacity:0;visibility:hidden}
.hero h1{font:900 clamp(32px,5vw,88px)/1.14 var(--serif);letter-spacing:.03em}
.hero__cue{margin-top:clamp(18px,3vh,32px);display:flex;align-items:center;gap:16px;font-size:clamp(12px,1.05vw,15px);letter-spacing:.24em}
.hero__cue::before{content:"";width:56px;height:1px;background:currentColor;transform-origin:left;animation:cue 2.6s ease-in-out infinite}
@keyframes cue{0%{transform:scaleX(.15)}55%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.2}}

/* ───────── 滚动文案：fixed，水平居中，淡入淡出切换 ─────────
   文案压在“漫画旁白框”上：不管背景是黑影棚、蓝影棚还是漫画白底，字都读得清 */
.captions{position:fixed;inset:0;z-index:6;pointer-events:none}
/* 每条字幕独立定位：left/top 由后台按视口百分比给出，默认沿用原来的居中位置 */
.caption{--cap-x:50;--cap-y:82;position:absolute;
  left:calc(var(--cap-x) * 1%);top:calc(var(--cap-y) * 1%);
  /* 锚点跟着位置线性移动：0% 时贴左/贴顶，50% 时居中，100% 时贴右/贴底。
     这样字幕能真正放到画面最边上，同时文字框永远不会超出视口。*/
  transform:translate(calc(var(--cap-x) * -1%),calc(var(--cap-y) * -1%));
  width:max-content;max-width:min(92vw,1100px);max-height:92vh;text-align:center;
  opacity:0;transition:opacity var(--fade) ease}
.caption.is-on{opacity:1}
/* 默认不加底板：字直接压在画面上。留一点内边距，避免毛笔笔锋的出锋被裁掉。
   需要底板时由后台逐条开启，加 .caption--panel。*/
.caption__text{position:relative;isolation:isolate;display:inline-block;padding:.12em .28em;color:#fff;
  font:900 calc(clamp(16px,2.05vw,34px) * var(--cap-scale,1))/1.6 var(--serif);
  letter-spacing:.06em;text-wrap:balance;
  transform:translateY(8px);transition:transform var(--fade) ease}
.caption.is-on .caption__text{transform:none}
/* 毛笔：笔画本身就重，不再加粗，字距放开一点 */
.caption--brush .caption__text,.caption--dry .caption__text{font-weight:400;letter-spacing:.1em;
  font-size:calc(clamp(20px,2.6vw,44px) * var(--cap-scale,1))}
.caption--brush .caption__text{font-family:var(--brush)}
.caption--dry .caption__text{font-family:var(--brush-dry)}

/* 竖排：一条直线从上落到底，永远不折列——像一道雨痕。
   nowrap 保证不换列；字数多时按 80vh / 字数 自动缩小字号，让整句一列装得下。
   （汉字沿列方向每字约一个 em，加上 .1em 字距，80vh 折算下来正好落在视口内。）*/
.caption--vertical .caption__text{writing-mode:vertical-rl;text-orientation:upright;
  white-space:nowrap;padding:.28em .12em;text-align:start;
  font-size:min(calc(clamp(16px,2.05vw,34px) * var(--cap-scale,1)),
                calc(80vh / var(--cap-len,12)))}
.caption--brush.caption--vertical .caption__text,
.caption--dry.caption--vertical .caption__text{
  font-size:min(calc(clamp(20px,2.6vw,44px) * var(--cap-scale,1)),
                calc(80vh / var(--cap-len,12)))}
.caption--black .caption__text{color:#07080b}

/* 底板：开启后恢复原来那块斜切色块，深浅跟着文字颜色翻 */
.caption--panel .caption__text{padding:.72em 1.7em .8em}
.caption--panel .caption__text::before{content:"";position:absolute;inset:0;z-index:-1;background:#050506;
  clip-path:polygon(0 12%,100% 0,99% 88%,1% 100%)}
.caption--panel.caption--black .caption__text::before{background:var(--paper)}
/* 竖排的底板：斜切方向跟着转 90° */
.caption--panel.caption--vertical .caption__text{padding:1.7em .8em 1.7em .72em}
.caption--panel.caption--vertical .caption__text::before{clip-path:polygon(88% 0,100% 100%,12% 99%,0 1%)}

/* ───────── 结尾影像：盖住全屏播放 ───────── */
.finale{position:fixed;inset:0;z-index:20;background:#000;
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.finale.is-on{opacity:1;visibility:visible;transition-delay:0s}
.finale__v{width:100%;height:100%;object-fit:contain;background:#000}
.finale__msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;
  color:#fff;font:500 15px/1.6 var(--sans);letter-spacing:.04em;text-align:center;pointer-events:none}
.finale__msg:empty{display:none}
.finale__close{position:absolute;right:clamp(14px,3vw,34px);top:clamp(14px,3vw,34px);
  width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.12);border:0;color:#fff;backdrop-filter:blur(6px);transition:.18s}
.finale__close:hover,.finale__close:focus-visible{background:rgba(255,255,255,.26)}
.finale__close svg{width:16px;height:16px}

/* ───────── 结尾：右侧说明 + 四个泡泡 ───────── */
.note{position:fixed;z-index:6;right:clamp(16px,4vw,96px);top:50%;transform:translateY(-50%);width:min(30vw,400px);
  padding:clamp(18px,2vw,30px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);
  opacity:0;visibility:hidden;transition:opacity var(--fade) ease,visibility 0s linear var(--fade)}
.note.is-on{opacity:1;visibility:visible;transition-delay:0s}
/* 集齐四个泡泡后才出现，并且可以点 */
.note.is-clickable{cursor:pointer}
.note.is-clickable:hover,.note:focus-visible{background:#fff;box-shadow:10px 10px 0 var(--rim);
  transform:translateY(-50%) translate(-3px,-3px)}
.note:focus-visible{outline:3px solid var(--rim);outline-offset:4px}
.note__cue{display:none;margin-top:1em;font:700 clamp(13px,1.1vw,15px)/1 var(--sans);color:var(--rim);
  letter-spacing:.04em}
.note.is-clickable .note__cue{display:inline-block}
.note.is-clickable .note__cue::after{content:" →";display:inline-block;transition:transform .2s ease}
.note.is-clickable:hover .note__cue::after{transform:translateX(4px)}
.note h2{font:900 clamp(20px,2.3vw,34px)/1.3 var(--serif);letter-spacing:.03em}
.note p{margin-top:.9em;font-size:clamp(13px,1.05vw,15px);line-height:1.85;color:var(--graphite)}

.bubbles{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity var(--fade) ease,visibility 0s linear var(--fade)}
.bubbles.is-on{opacity:1;visibility:visible;transition-delay:0s}
.bubble{position:absolute;pointer-events:none}
.bubble__img{display:none}
.bubble__hit{position:absolute;left:14%;top:14%;width:72%;height:72%;border:0;border-radius:50%;background:transparent;
  cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;outline:none}
.bubble__ring{position:absolute;inset:-1%;border-radius:50%;pointer-events:none;opacity:0;transform:scale(.96);
  box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 0 0 8px var(--rim);transition:opacity .2s ease,transform .3s ease}
.bubble__hit:focus-visible + .bubble__ring{opacity:1;transform:none}
.bubble__hit:hover + .bubble__ring{opacity:1;transform:none}
/* 出现时给一次提示：每个泡泡外扩一圈洋红，只播两轮 */
.bubbles.is-on .bubble::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--rim);opacity:0;pointer-events:none;
  animation:ping 1.5s ease-out calc(var(--i) * .2s + .3s) 2}
@keyframes ping{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.14)}}

/* 竖屏：视频里的泡泡被裁掉了，用同一批图片排成 2×2 */
html[data-layout="grid"] .bubbles{inset:auto;left:50%;right:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);
  transform:translateX(-50%);width:min(92vw,420px);display:grid;grid-template-columns:1fr 1fr;gap:5vw}
html[data-layout="grid"] .bubble{position:relative;aspect-ratio:1}
html[data-layout="grid"] .bubble__img{display:block;position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;
  background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 3px #fff}
html[data-layout="grid"] .bubble__hit{left:0;top:0;width:100%;height:100%}
html[data-layout="grid"] .note{right:4vw;left:4vw;width:auto;top:calc(env(safe-area-inset-top,0px) + 56px);transform:none;box-shadow:5px 5px 0 var(--ink)}
html[data-layout="grid"] .note h2{font-size:clamp(20px,6vw,28px)}
html[data-layout="grid"] .note p{font-size:13px}
html[data-layout="grid"] .rail{display:none}

/* ───────── 点开泡泡：左侧放大 + 背景虚化 + 右侧对话框 ───────── */
.viewer{position:fixed;inset:0;z-index:50;display:none}
.viewer.is-mounted{display:block}
.viewer__backdrop{position:absolute;inset:0;background:rgba(5,6,9,.45);opacity:0;transition:opacity .6s ease;touch-action:none}
.viewer.is-open .viewer__backdrop{opacity:1}

.zoom{position:absolute;transform-origin:0 0;transition:transform .8s cubic-bezier(.16,.84,.24,1);will-change:transform}
.zoom__disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;
  box-shadow:0 0 0 clamp(3px,.45vw,6px) var(--ink),0 0 0 clamp(6px,.85vw,11px) #fff,0 30px 80px rgba(0,0,0,.55)}
.zoom__disc img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}

.dialog{position:absolute;right:clamp(20px,6vw,96px);top:50%;width:min(540px,44vw);max-height:min(82vh,760px);
  display:flex;flex-direction:column;padding:clamp(22px,2.6vw,38px);
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);outline:none;
  opacity:0;transform:translateY(-50%) translateX(28px);
  transition:opacity .5s ease .25s,transform .7s cubic-bezier(.16,.84,.24,1) .25s}
.viewer.is-open .dialog{opacity:1;transform:translateY(-50%)}
.dialog::before{content:"";position:absolute;left:-14px;top:calc(50% - 12px);width:24px;height:24px;background:var(--paper);
  border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.dialog__scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding-right:4px}
.dialog__title{font:900 clamp(40px,4.4vw,64px)/1.05 var(--serif);letter-spacing:.04em;padding-right:44px}
.dialog__lead{margin-top:.7em;font:700 clamp(17px,1.5vw,21px)/1.6 var(--serif)}
.dialog__body{margin-top:1em;font-size:15.5px;line-height:1.95;color:var(--graphite)}
.dialog__steps{margin-top:1.4em;list-style:none;counter-reset:s;display:grid;gap:11px}
.dialog__steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.75}
.dialog__steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;margin-top:.15em;border-radius:50%;
  background:var(--ink);color:#fff;font:700 13px/1 var(--sans)}
.dialog__steps a{color:inherit;text-decoration:none;background-image:linear-gradient(var(--rim),var(--rim));
  background-size:100% 2px;background-repeat:no-repeat;background-position:0 100%;
  transition:background-size .2s ease,color .2s ease}
.dialog__steps a:hover,.dialog__steps a:focus-visible{color:var(--rim)}
.dialog__steps a::after{content:"→";display:inline-block;margin-left:.45em;
  transform:translateX(-3px);opacity:0;transition:.2s ease}
.dialog__steps a:hover::after,.dialog__steps a:focus-visible::after{transform:none;opacity:1}
.dialog__tabs{flex:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:18px;border-top:2px solid var(--ink)}
.dialog__tab{padding:.7em 1.15em;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);
  font:700 14px/1 var(--serif);letter-spacing:.06em;cursor:pointer;transition:background .2s,color .2s}
.dialog__tab[aria-current="true"]{background:var(--ink);color:#fff}
.dialog__tab:not([aria-current="true"]):hover{background:rgba(7,8,11,.08)}
.dialog__close{position:absolute;right:14px;top:14px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink);
  border-radius:50%;background:var(--paper);cursor:pointer;z-index:1}
.dialog__close svg{width:16px;height:16px}
.dialog :focus-visible,.bubble__hit:focus-visible{outline:3px solid var(--rim);outline-offset:3px}
.bubble__hit:focus-visible{outline:none}

html[data-layout="grid"] .dialog{left:4vw;right:4vw;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vh);width:auto;max-height:54vh;
  transform:translateY(28px);padding:20px 20px 16px;box-shadow:5px 5px 0 var(--ink)}
html[data-layout="grid"] .viewer.is-open .dialog{transform:none}
html[data-layout="grid"] .dialog::before{left:calc(50% - 12px);top:-14px;border-bottom:0;border-top:3px solid var(--ink)}
html[data-layout="grid"] .dialog__title{font-size:38px}
html[data-layout="grid"] .dialog__tabs{margin-top:14px;padding-top:12px;flex-wrap:nowrap;overflow-x:auto}
html[data-layout="grid"] .dialog__tab{flex:none}

@media (max-width:820px) and (min-aspect-ratio:85/100){          /* 横屏的小手机 */
  .dialog{width:min(540px,50vw)}
  .dialog__title{font-size:34px}
  .dialog__body,.dialog__steps li{font-size:14px}
}

@media (prefers-reduced-motion:reduce){
  .hero__cue::before{animation:none}
  .bubbles.is-on .bubble::after{animation:none}
  .stage,.zoom,.dialog{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>
<body>

<!-- 三段视频同时渲染：intro-loop / main(滚动驱动) / outro-loop -->
<div class="stage" id="stage" aria-hidden="true">
  <video id="v-intro" class="layer is-on" autoplay loop muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <video id="v-main"  class="layer" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <video id="v-outro" class="layer" loop muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
</div>
<div class="scrim" aria-hidden="true"></div>

<div class="brand">Kane Wang转正汇报</div>
<div class="rail" id="rail" aria-hidden="true"><div class="rail__line"></div><div class="rail__fill"></div></div>

<header class="hero" id="hero">
  <h1>我把复杂的东西，<br>拆开，再装好。</h1>
  <p class="hero__cue" id="cue">影像载入中 0%</p>
</header>

<!-- 三个节奏点的文案（时间区间在下方 CONFIG.beats 里） -->
<div class="captions" id="captions" aria-live="polite">
  <p class="caption"><span class="caption__text">所有好设计，都是从一片漆黑里，被光一点点认出来的。</span></p>
  <p class="caption"><span class="caption__text">灯亮之后我不解释，只用一笔，把世界翻成另一种语言。</span></p>
  <p class="caption"><span class="caption__text">指尖一弹，四个念头飞了出去，每一个都是我不肯让步的答案。</span></p>
</div>

<aside class="note" id="note" role="button" tabindex="-1" aria-label="播放结尾影像">
  <h2>拆开，跑快，收紧，回头看。</h2>
  <p>四个泡泡，是我做每个项目都会回到的四个动作。点开一个，看看我怎么想。</p>
  <span class="note__cue" id="noteCue">点我，看最后一段</span>
</aside>

<!-- 结尾影像：点结尾框才播，带声音（由点击这个用户手势触发） -->
<div class="finale" id="finale" aria-hidden="true">
  <video id="v-finale" class="finale__v" playsinline webkit-playsinline preload="none" disablepictureinpicture></video>
  <p class="finale__msg" id="finaleMsg" aria-live="polite"></p>
  <button class="finale__close" id="finaleClose" type="button" aria-label="关闭结尾影像">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l12 12M14 2L2 14"/></svg>
  </button>
</div>
<div class="bubbles" id="bubbles"></div>

<div class="viewer" id="viewer">
  <div class="viewer__backdrop" id="backdrop"></div>
  <div class="zoom" id="zoom"><div class="zoom__disc" id="zoomDisc"><img id="zoomImg" alt="" draggable="false"></div></div>

  outroAt: 0.98,                // 滚动进度 ≥ 这个值 = 尾屏 outro-loop
  bubblesAt: 0.98,              // 进度 ≥ 这个值泡泡才可点。主视频最后一点泡泡还在归位，等尾屏接上再开放
  smoothing: 0.18,              // 视频追滚动的平滑系数（0~1，越大越跟手）

  /* 三个节奏点：对应主视频的时间区间（秒） */
  beats: [
    { from: 0.02, to: 2.3 },    // 黑屏剪影 → 聚光灯打下
    { from: 2.5,  to: 4.9 },    // 背景渐亮、抬手压墨镜 → 墨线扫过，翻成漫画
    { from: 5.1,  to: 7.5 }     // 漫画特写、手枪手势 → 泡泡射出
  ],

  /* 竖屏/窄屏时，视频水平方向的取景焦点：[秒, 0~1]。0 = 靠左，0.5 = 居中 */
  focus: [[0, .5], [4.5, .5], [5.5, .3], [7.0, .3], [7.9, 0]],

  /* 四个泡泡：cx/cy/r 是它在视频画面（2560×1440）里的圆心与半径 */
  bubbles: [
    { name: '解构', cx: 548, cy: 298,  r: 252,
      lead: '先拆开，才看得清它为什么长这样。',

      steps: ['把需求拆到不能再拆：谁在用、在哪用、为什么用', '标出哪些是硬约束，哪些只是习惯', '只留下会改变结果的那几块，其余放下'] },
    { name: '敏捷', cx: 992, cy: 428,  r: 222,

      body: '第一版永远不体面。我用最粗的稿子最先去撞现实，让真实的反应告诉我往哪边走，而不是靠会议室里的推演。',
      steps: ['一天之内做出能点的粗稿', '每一轮只回答一个问题', '把决定和理由写下来，下一轮直接接着用'] },
    { name: '控制', cx: 968, cy: 770,  r: 228,
      lead: '自由是设计出来的，不是放出来的。',

      steps: ['先定设计变量，再画页面', '每个组件写明什么时候不该用', '交付时附上能直接运行的规范'] },
    { name: '闭环', cx: 736, cy: 1180, r: 252,

      steps: ['上线前先写好怎样算成功', '用数据和访谈互相验证', '把复盘沉淀成下次能直接用的规则'] }

};

/* ── 后台内容合并 ──
   window.__CONTENT__ 由服务端注入（仅含已发布内容）。没有注入、字段缺失或格式不对时，
   下面的每一步都会安静跳过，CONFIG 保持页面内置值不变。整段包在 try 里，绝不影响渲染。*/
(function applyContent(){
  var C = window.__CONTENT__;
  if (!C || typeof C !== 'object') return;
  var txt = function (el, s) { if (el && typeof s === 'string' && s) el.textContent = s; };
  try {
    var site = C.site || {};
    txt(document.querySelector('.brand'), site.brand);
    txt(document.querySelector('.note h2'), site.noteTitle);
    txt(document.querySelector('.note p'), site.noteBody);

    // 首屏标题：用 <br> 元素拼，不用 innerHTML
    if (Array.isArray(site.heroTitle) && site.heroTitle.length) {
      var h1 = document.querySelector('.hero h1');
      if (h1 && site.heroTitle.every(function (l) { return typeof l === 'string' && l; })) {
        h1.textContent = '';
        site.heroTitle.forEach(function (line, i) {
          if (i) h1.appendChild(document.createElement('br'));
          h1.appendChild(document.createTextNode(line));
        });
      }
    }

    // 字幕：文案 + 对应的 beats 时间区间。两者必须等长，否则整体放弃。
    if (Array.isArray(C.captions) && C.captions.length) {
      var wrap = document.querySelector('#captions');
      var ok = C.captions.every(function (c) {
        return c && typeof c.text === 'string' && c.text &&
               typeof c.from === 'number' && typeof c.to === 'number' && c.from < c.to;
      });
      if (wrap && ok) {
        var inRange = function (v) { return typeof v === 'number' && v >= 0 && v <= 100; };
        wrap.textContent = '';
        C.captions.forEach(function (c) {
          var p = document.createElement('p');
          p.className = 'caption'
            + (c.font === 'brush' ? ' caption--brush' : '')
            + (c.font === 'dry' ? ' caption--dry' : '')
            + (c.color === 'black' ? ' caption--black' : '')
            + (c.orient === 'vertical' ? ' caption--vertical' : '')
            + (c.panel === true ? ' caption--panel' : '');
          // 位置与字号越界就不设，交回样式表里的默认值
          if (inRange(c.x)) p.style.setProperty('--cap-x', c.x);
          if (inRange(c.y)) p.style.setProperty('--cap-y', c.y);
          p.style.setProperty('--cap-len', c.text.length);
          if (typeof c.size === 'number' && c.size >= 60 && c.size <= 220) {
            p.style.setProperty('--cap-scale', c.size / 100);
          }
          var span = document.createElement('span');
          span.className = 'caption__text';
          span.textContent = c.text;
          p.appendChild(span);
          wrap.appendChild(p);
        });
        CONFIG.beats = C.captions.map(function (c) { return { from: c.from, to: c.to }; });
      }
    }

    // 泡泡：文案与几何。几何越界的条目整条放弃，避免泡泡飘出画面。
    if (Array.isArray(C.bubbles) && C.bubbles.length) {
      var V = CONFIG.video;
      var good = C.bubbles.filter(function (b) {
        return b && typeof b.name === 'string' && b.name &&
               typeof b.lead === 'string' && typeof b.body === 'string' &&
               Array.isArray(b.steps) && b.steps.length &&
               b.steps.every(function (s) {
                 return s && typeof s.text === 'string' && s.text;
               }) &&
               typeof b.cx === 'number' && b.cx >= 0 && b.cx <= V.w &&
               typeof b.cy === 'number' && b.cy >= 0 && b.cy <= V.h &&
               typeof b.r === 'number' && b.r >= 40 && b.r <= 600;
      });
      if (good.length === C.bubbles.length) {
        CONFIG.bubbles = good.map(function (b) {
          return { name: b.name, lead: b.lead, body: b.body,
                   steps: b.steps.map(function (s) {
                     return { text: s.text, page: typeof s.page === 'number' ? s.page : null };
                   }),
                   cx: b.cx, cy: b.cy, r: b.r };
        });
      }
    }
  } catch (e) {
    if (location.hostname === 'localhost' || location.search.indexOf('debug') > -1) {
      console.warn('[内容合并失败，已回退到内置内容]', e);
    }
  }
})();

/* ════════════════ 基础工具 ════════════════ */
const IMG  = window.__BUBBLE_IMG__ || [];
const root = document.documentElement;
const $    = (s, c = document) => c.querySelector(s);
const clamp  = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp   = (a, b, t) => a + (b - a) * t;
const smooth = k => k * k * (3 - 2 * k);

const vIntro = $('#v-intro'), vMain = $('#v-main'), vOutro = $('#v-outro');
const hero = $('#hero'), cue = $('#cue'), rail = $('#rail');
const caps = Array.from(document.querySelectorAll('.caption'));
const note = $('#note'), noteCue = $('#noteCue'), bubblesEl = $('#bubbles');
const finale = $('#finale'), vFinale = $('#v-finale'), finaleMsg = $('#finaleMsg'), finaleClose = $('#finaleClose');
const viewer = $('#viewer'), backdrop = $('#backdrop'), zoom = $('#zoom'), zoomDisc = $('#zoomDisc'), zoomImg = $('#zoomImg');
const dialog = $('#dialog'), dlgClose = $('#dlgClose'), dlgScroll = $('#dlgScroll');
const dlgTitle = $('#dlgTitle'), dlgLead = $('#dlgLead'), dlgBody = $('#dlgBody'), dlgSteps = $('#dlgSteps'), dlgTabs = $('#dlgTabs');

const S = {
  dur: CONFIG.fallbackDuration,
  cur: 0,                 // 平滑后的“当前应显示的视频秒数”
  progress: 0,
  state: 'intro',         // intro | main | outro
  mainReady: false,
  introFailed: false,
  mainStatus: 0,
  tail: !CONFIG.src.outro,
  px: .5,
  mx: 0, my: 0, smx: 0, smy: 0,
  locked: false, lockedP: 0, lockScrollY: 0,
  open: false, idx: -1,
  seen: new Set(),        // 点开过的泡泡，四个集齐结尾框才出现
  armed: false,           // 结尾影像是否已开始预载
  playing: false,         // 结尾影像是否正在播
  layout: 'exact',
  reduce: matchMedia('(prefers-reduced-motion: reduce)').matches
};

/* ════════════════ 视频加载 ════════════════
   主视频先整段下载成 Blob 再喂给 <video>：
   ① 保证倒放/拖动时不再走网络，不会一滚就卡；② iOS Safari 会无视 preload="auto"，这样也能保证有数据。
   fetch 失败（比如直接双击打开 file://）就自动回退成普通 src。*/
async function fetchAsBlobUrl(url, onProgress) {
  try {
    const res = await fetch(url);
    if (!res.ok) { S.mainStatus = res.status; throw new Error(res.status); }
    const total = +res.headers.get('content-length') || 0;
    if (!res.body || !res.body.getReader) return URL.createObjectURL(await res.blob());
    const reader = res.body.getReader(), chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) onProgress(got / total);
    }
    return URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
  } catch (e) { return url; }
}

function initVideos() {
  vOutro.loop = !S.tail;   // 尾屏用主视频结尾时，循环由下面的 tick 手动做
  vIntro.src = CONFIG.src.intro;
  if (CONFIG.src.outro) vOutro.src = CONFIG.src.outro;
  vIntro.play().catch(() => {});
  const checkIntro = () => {                            // 首屏素材缺失/加载失败 → 首屏改用主视频第一帧
    if (!S.introFailed && (vIntro.error || vIntro.networkState === HTMLMediaElement.NETWORK_NO_SOURCE)) { S.introFailed = true; setLayers(); }
  };
  vIntro.addEventListener('error', checkIntro);
  setTimeout(checkIntro, 600);                          // 不能立刻查：刚设 src 时 networkState 会短暂等于 NO_SOURCE
  setTimeout(checkIntro, 2500);

  vMain.addEventListener('loadedmetadata', () => {
    S.dur = vMain.duration || CONFIG.fallbackDuration;
    root.style.setProperty('--dur', S.dur);
    placeRailTicks();
  });
  vMain.addEventListener('loadeddata', () => {
    const onSeeked = () => {
      vMain.removeEventListener('seeked', onSeeked);
      S.mainReady = true;
      cue.textContent = '向下滚动，看我怎么想';
      primeMain();
    };
    vMain.addEventListener('seeked', onSeeked);
    vMain.currentTime = 0.001;         // 让第一帧真正渲染出来
  });
  vMain.addEventListener('error', () => {
    const files = [CONFIG.src.intro, CONFIG.src.main, CONFIG.src.outro].filter(Boolean).join('、');
    let msg;
    if (S.mainStatus) msg = `找不到 ${CONFIG.src.main}（HTTP ${S.mainStatus}）。请把 ${files} 和 index.html 放在同一个文件夹`;
    else if (location.protocol === 'file:') msg = `读不到 ${CONFIG.src.main}。请确认 ${files} 和 index.html 在同一个文件夹`;
    else msg = `${CONFIG.src.main} 无法播放。请确认文件完整，且是 H.264 编码的 mp4`;
    cue.textContent = msg;
    console.error('[main video]', msg, vMain.error);
  });

  fetchAsBlobUrl(CONFIG.src.main, f => { if (!S.mainReady) cue.textContent = '影像载入中 ' + Math.round(f * 100) + '%'; })
    .then(url => {
      vMain.src = url;
      if (!CONFIG.src.outro) vOutro.src = url;
    });
}

/* iOS：muted + playsinline 的视频先 play 再 pause 一次，之后 currentTime 才会稳定出画面 */
function primeMain() {
  if (S.primed || vMain.readyState < 2) return;
  S.primed = true;
  const p = vMain.play();
  if (p && p.then) p.then(() => vMain.pause()).catch(() => { S.primed = false; });
}
['touchstart', 'pointerdown', 'wheel', 'keydown'].forEach(ev =>
  addEventListener(ev, () => { primeMain(); vIntro.play().catch(() => {}); }, { once: true, passive: true }));

/* ════════════════ 三段式切换 ════════════════ */
const introEl = () => (S.introFailed ? vMain : vIntro);

function computeState(p) {
  if (!S.mainReady) return 'intro';
  if (S.state === 'outro' && p > CONFIG.outroAt - .006) return 'outro';   // 回差，避免在阈值上来回闪
  if (p >= CONFIG.outroAt) return 'outro';
  if (p <= CONFIG.introEps) return 'intro';
  return 'main';
}

function setLayers() {
  const active = S.state === 'outro' ? vOutro : (S.state === 'intro' ? introEl() : vMain);
  [vIntro, vMain, vOutro].forEach(v => v.classList.toggle('is-on', v === active));
}

function setState(next) {
  if (next === S.state) return;
  const prev = S.state;
  S.state = next;
  setLayers();

  if (next === 'intro') vIntro.play().catch(() => {});
  if (next === 'outro' && !S.open) {
    vOutro.currentTime = S.tail ? clamp(S.cur, CONFIG.tailLoopFrom, S.dur - .06) : 0;   // 独立尾屏的第一帧 = 主视频最后一帧，接得上
    vOutro.play().catch(() => {});
  }
  if (prev === 'main' && next === 'intro') vMain.style.transform = '';
  setTimeout(() => {                                     // 淡出结束后再暂停，省解码
    if (S.state !== 'intro') vIntro.pause();
    if (S.state !== 'outro') vOutro.pause();
  }, 650);
}

/* ════════════════ 滚动 → 视频进度 ════════════════ */
function seekMain(t) {
  if (vMain.readyState < 1 || vMain.seeking) return;     // 上一次 seek 没完成就先等，避免堆积
  const tt = clamp(t, 0, S.dur - .001);
  if (Math.abs(vMain.currentTime - tt) > .012) vMain.currentTime = tt;
}

function focusAt(t) {
  const f = CONFIG.focus;
  if (t <= f[0][0]) return f[0][1];
  for (let i = 1; i < f.length; i++) {
    if (t <= f[i][0]) {
      const [t0, v0] = f[i - 1], [t1, v1] = f[i];
      return lerp(v0, v1, smooth((t - t0) / (t1 - t0)));
    }
  }
  return f[f.length - 1][1];
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;

  const maxScroll = Math.max(1, root.scrollHeight - innerHeight);
  const p = S.locked ? S.lockedP : clamp(scrollY / maxScroll);
  S.progress = p;

  const target = p * S.dur;                              // 滚动进度 × 时长 = 目标时间
  const next = computeState(p);
  if (next === 'outro' || Math.abs(target - S.cur) < .0015) S.cur = target;
  else S.cur += (target - S.cur) * (1 - Math.pow(1 - CONFIG.smoothing, dt * 60));   // rAF 平滑追赶，避免一步跳过去卡顿

  setState(next);
  if (S.mainReady && S.state !== 'outro') seekMain(S.cur);
  if (S.state === 'outro' && S.tail) {                   // 尾屏循环：播到结尾就跳回 tailLoopFrom
    const ct = vOutro.currentTime;
    if (ct >= S.dur - .05 || ct < CONFIG.tailLoopFrom - .5) vOutro.currentTime = CONFIG.tailLoopFrom;
  }

  const px = focusAt(S.cur);                             // 竖屏/窄屏时，让取景跟着画面重点走
  if (Math.abs(px - S.px) > .0004) { S.px = px; vMain.style.objectPosition = (px * 100).toFixed(2) + '% 50%'; }

  updateOverlays(p);
  updateParallax();
  rail.style.setProperty('--p', p.toFixed(4));
  requestAnimationFrame(tick);
}

function updateOverlays(p) {
  hero.classList.toggle('is-off', S.state !== 'intro');
  caps.forEach((c, i) => {
    const b = CONFIG.beats[i];
    c.classList.toggle('is-on', !!b && S.state === 'main' && S.cur >= b.from && S.cur < b.to);
  });
  const end = S.mainReady && p >= CONFIG.bubblesAt && S.cur >= CONFIG.bubblesAt * S.dur - .1;
  root.classList.toggle('at-end', end);
  // 结尾框要等四个泡泡都点开过才出现，并且此时它是可点的
  const done = S.seen.size >= CONFIG.bubbles.length;
  const showNote = end && !S.open && !S.playing && done;
  note.classList.toggle('is-on', showNote);
  note.classList.toggle('is-clickable', done);
  note.tabIndex = showNote ? 0 : -1;
  bubblesEl.classList.toggle('is-on', end && !S.open);
}

/* 首屏跟随鼠标：画面反向位移，文案同向轻移，做出一点纵深 */
addEventListener('pointermove', e => {
  S.mx = (e.clientX / innerWidth - .5) * 2;
  S.my = (e.clientY / innerHeight - .5) * 2;
}, { passive: true });

function updateParallax() {
  if (S.reduce) return;
  S.smx = lerp(S.smx, S.mx, .06);
  S.smy = lerp(S.smy, S.my, .06);
  if (S.state !== 'intro') return;
  introEl().style.transform = `translate3d(${(-S.smx * 26).toFixed(2)}px,${(-S.smy * 15).toFixed(2)}px,0) scale(1.07)`;
  hero.style.transform = `translate3d(${(S.smx * 10).toFixed(2)}px,${(S.smy * 6).toFixed(2)}px,0)`;
}

function placeRailTicks() {
  rail.querySelectorAll('.rail__tick').forEach(n => n.remove());
  CONFIG.beats.forEach(b => {
    const t = document.createElement('i');
    t.className = 'rail__tick';
    t.style.top = (b.from / S.dur * 100) + '%';
    rail.appendChild(t);
  });
}

/* ════════════════ 泡泡：叠在视频泡泡上的点击热区 ════════════════
   横屏：按 object-fit:cover 的换算，把热区精确盖在视频里的泡泡上；
   竖屏：视频会被裁掉泡泡，改成 2×2 网格（见 CSS）。*/
const bubbleEls = CONFIG.bubbles.map((b, i) => {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.setProperty('--i', i);
  // 同样用 DOM 构造：b.name 来自后台，插进属性里会被当作标记解析
  const img = document.createElement('img');
  img.className = 'bubble__img';
  img.src = IMG[i] || '';
  img.alt = '';
  img.draggable = false;
  const hit = document.createElement('button');
  hit.className = 'bubble__hit';
  hit.type = 'button';
  hit.setAttribute('aria-label', b.name + '：点开查看');
  const ring = document.createElement('span');
  ring.className = 'bubble__ring';
  el.append(img, hit, ring);
  hit.addEventListener('click', () => openBubble(i));
  bubblesEl.appendChild(el);
  return el;
});

function layoutBubbles() {
  S.layout = innerWidth / innerHeight < .85 ? 'grid' : 'exact';
  root.dataset.layout = S.layout;
  const props = ['left', 'top', 'width', 'height'];
  if (S.layout === 'grid') { bubbleEls.forEach(el => props.forEach(p => el.style.removeProperty(p))); return; }
  const W = innerWidth, H = innerHeight, { w: VW, h: VH } = CONFIG.video;
  const s  = Math.max(W / VW, H / VH);
  const px = CONFIG.focus[CONFIG.focus.length - 1][1];
  const ox = (W - VW * s) * px, oy = (H - VH * s) * .5;
  bubbleEls.forEach((el, i) => {
    const b = CONFIG.bubbles[i], d = 2 * b.r * s;
    el.style.left = (ox + (b.cx - b.r) * s) + 'px';
    el.style.top = (oy + (b.cy - b.r) * s) + 'px';
    el.style.width = d + 'px';
    el.style.height = d + 'px';
  });
}

/* ════════════════ 放大 + 虚化 + 对话框 ════════════════ */
CONFIG.bubbles.forEach((b, i) => {
  const t = document.createElement('button');
  t.type = 'button'; t.className = 'dialog__tab'; t.textContent = b.name;
  t.addEventListener('click', () => swapBubble(i));
  dlgTabs.appendChild(t);
});
const tabEls = Array.from(dlgTabs.children);

function zoomTarget() {
  const W = innerWidth, H = innerHeight;
  if (S.layout === 'grid') {
    const d = Math.min(W * .5, H * .27);
    return { x: (W - d) / 2, y: Math.max(56, H * .07), d };
  }
  const d = Math.min(H * .62, W * .4, 620);
  return { x: W * .27 - d / 2, y: H * .5 - d / 2, d };
}
const flipFrom = (from, to) =>
  `translate(${from.left - to.x}px,${from.top - to.y}px) scale(${from.width / to.d})`;

function fillDialog(i) {
  const b = CONFIG.bubbles[i];
  dlgTitle.textContent = b.name;
  dlgLead.textContent = b.lead;
  dlgBody.textContent = b.body;
  // 用 DOM 构造而不是拼 innerHTML：步骤文案来自后台，拼字符串等于开了注入口子
  dlgSteps.textContent = '';
  b.steps.forEach(s => {
    const step = (typeof s === 'string') ? { text: s, page: null } : s;
    const li = document.createElement('li');
    let node;
    if (typeof step.page === 'number') {
      node = document.createElement('a');
      node.href = '/p/' + step.page;
      node.setAttribute('aria-label', step.text + '（展开这一条）');
    } else {
      node = document.createElement('span');
    }
    node.textContent = step.text;
    li.appendChild(node);
    dlgSteps.appendChild(li);
  });
  tabEls.forEach((t, k) => t.setAttribute('aria-current', k === i ? 'true' : 'false'));
  dlgScroll.scrollTop = 0;
}

function openBubble(i) {
  if (S.open) return swapBubble(i);
  S.open = true; S.idx = i;
  S.seen.add(i);
  if (S.seen.size >= CONFIG.bubbles.length) armFinale();
  S.locked = true; S.lockedP = S.progress; S.lockScrollY = scrollY;
  root.classList.add('is-viewing');
  if (S.state === 'outro') vOutro.pause();               // 背景已虚化，暂停解码省电

  fillDialog(i);
  zoomImg.src = IMG[i] || '';
  const from = bubbleEls[i].getBoundingClientRect(), to = zoomTarget();
  Object.assign(zoom.style, { left: to.x + 'px', top: to.y + 'px', width: to.d + 'px', height: to.d + 'px', transition: 'none',
    transform: flipFrom(from, to) });
  viewer.classList.add('is-mounted');
  void zoom.offsetWidth;                                 // 强制回流，让起点生效
  requestAnimationFrame(() => {
    zoom.style.transition = '';
    zoom.style.transform = 'none';
    viewer.classList.add('is-open');
  });
  setTimeout(() => dialog.focus({ preventScroll: true }), 350);
}

function swapBubble(i) {
  S.seen.add(i);
  if (S.seen.size >= CONFIG.bubbles.length) armFinale();
  if (!S.open || i === S.idx) return;
  S.idx = i;
  fillDialog(i);
  zoomImg.src = IMG[i] || '';
  if (!S.reduce) {
    zoomDisc.animate([{ transform: 'scale(.9)', opacity: .35 }, { transform: 'scale(1)', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
    dlgScroll.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'ease-out' });
  }
}

function closeViewer() {
  if (!S.open) return;
  const i = S.idx;
  S.open = false;
  viewer.classList.remove('is-open');
  const from = bubbleEls[i].getBoundingClientRect(), to = zoomTarget();
  zoom.style.transform = flipFrom(from, to);             // 回到原来那个泡泡的位置
  root.classList.remove('is-viewing');
  S.locked = false;
  if (Math.abs(scrollY - S.lockScrollY) > 1) scrollTo(0, S.lockScrollY);
  if (S.state === 'outro') vOutro.play().catch(() => {});
  setTimeout(() => { if (!S.open) viewer.classList.remove('is-mounted'); }, 850);
  const hit = bubbleEls[i].querySelector('.bubble__hit');
  setTimeout(() => hit && hit.focus({ preventScroll: true }), 400);
}

/* ════════════════ 结尾影像 ════════════════
   17MB，不在首屏预载。等四个泡泡都点开过（结尾框即将出现）才挂 src 开始下载，
   这时用户正在读结尾框的文案，有几秒缓冲。文件已做过 faststart，不必等下完就能起播。*/
function armFinale() {
  if (S.armed) return;
  S.armed = true;
  vFinale.preload = 'auto';
  vFinale.src = CONFIG.src.finale;
  vFinale.load();
}

function playFinale() {
  if (S.playing || !S.seen.size) return;
  if (!S.armed) armFinale();

  S.playing = true;
  S.locked = true; S.lockedP = S.progress; S.lockScrollY = scrollY;
  root.classList.add('is-viewing');
  if (S.state === 'outro') vOutro.pause();               // 背景被盖住了，暂停解码省电

  finale.classList.add('is-on');
  finale.setAttribute('aria-hidden', 'false');
  finaleMsg.textContent = '';
  vFinale.currentTime = 0;
  vFinale.muted = false;                                 // 这一段是有声的

  // play() 必须留在点击的同步调用栈里，否则 iOS Safari 会拒绝带声播放
  const go = vFinale.play();
  if (go && go.catch) {
    go.catch(() => {
      // 带声被拒就退回静音播放，总比黑屏强
      vFinale.muted = true;
      vFinale.play().catch(() => {
        finaleMsg.textContent = '这段影像没能播放，请刷新后再试';
      });
    });
  }
  setTimeout(() => finaleClose.focus({ preventScroll: true }), 400);
}

function endFinale() {
  if (!S.playing) return;
  S.playing = false;
  vFinale.pause();
  finale.classList.remove('is-on');
  finale.setAttribute('aria-hidden', 'true');
  finaleMsg.textContent = '';
  root.classList.remove('is-viewing');
  S.locked = false;
  if (Math.abs(scrollY - S.lockScrollY) > 1) scrollTo(0, S.lockScrollY);
  if (S.state === 'outro') vOutro.play().catch(() => {});
  setTimeout(() => note.focus({ preventScroll: true }), 300);
}

note.addEventListener('click', () => {
  if (note.classList.contains('is-clickable')) playFinale();
});
note.addEventListener('keydown', e => {
  if (!note.classList.contains('is-clickable')) return;
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); playFinale(); }
});
finaleClose.addEventListener('click', endFinale);
vFinale.addEventListener('ended', endFinale);
vFinale.addEventListener('error', () => {
  if (S.playing) finaleMsg.textContent = '这段影像读不到，请确认 ' + CONFIG.src.finale + ' 和 index.html 在同一个文件夹';
});
vFinale.addEventListener('waiting', () => { if (S.playing) finaleMsg.textContent = '影像载入中…'; });
vFinale.addEventListener('playing', () => { finaleMsg.textContent = ''; });
addEventListener('keydown', e => {
  if (S.playing && e.key === 'Escape') { e.preventDefault(); endFinale(); }
});

dlgClose.addEventListener('click', closeViewer);
backdrop.addEventListener('click', closeViewer);
addEventListener('keydown', e => {
  if (!S.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); swapBubble((S.idx + 1) % CONFIG.bubbles.length); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); swapBubble((S.idx + CONFIG.bubbles.length - 1) % CONFIG.bubbles.length); }
  else if (e.key === 'Tab') {                            // 焦点锁在对话框里
    const f = [dlgClose, ...tabEls];
    const at = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(at + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  }
});

/* ════════════════ 启动 ════════════════ */
function onResize() {
  layoutBubbles();
  if (S.open) {
    const to = zoomTarget();
    Object.assign(zoom.style, { left: to.x + 'px', top: to.y + 'px', width: to.d + 'px', height: to.d + 'px', transition: 'none', transform: 'none' });
    void zoom.offsetWidth; zoom.style.transition = '';
  }
}
addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { vIntro.pause(); vOutro.pause(); }
  else { if (S.state === 'intro') vIntro.play().catch(() => {}); if (S.state === 'outro' && !S.open) vOutro.play().catch(() => {}); }
});
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';   // 刷新后回到首屏，避免直接落在中间帧

vOutro.style.objectPosition = (CONFIG.focus[CONFIG.focus.length - 1][1] * 100) + '% 50%';
root.style.setProperty('--dur', S.dur);
placeRailTicks();
layoutBubbles();
initVideos();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
