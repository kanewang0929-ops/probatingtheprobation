# Render Blueprint
# 前台与后台由同一个 Node 服务提供：
#   /        转正汇报页面（服务端注入已发布内容，数据库不可用时回退到页面内置内容）
#   /admin   内容后台
#   /preview 草稿预览（需登录）
databases:
  - name: kane-wang-report-db
    plan: free
    region: oregon

services:
  - type: web
    runtime: node
    name: kane-wang-report-cms
    plan: free
    region: oregon
    branch: claude/focused-franklin-kg99y5
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kane-wang-report-db
          property: connectionString
      # 后台密码：在 Render 控制台手动填写，不写进仓库
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
